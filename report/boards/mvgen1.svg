  <circle cx="70.0" cy="420.0" r="26.0" fill="#d32f2f" stroke="#222" stroke-width="1"/>
  <circle cx="140.0" cy="420.0" r="26.0" fill="#fdd835" stroke="#222" stroke-width="1"/>
  <circle cx="140.0" cy="350.0" r="26.0" fill="#d32f2f" stroke="#222" stroke-width="1"/>
