  <circle cx="490" cy="280" r="26" fill="#ffffff"/>

  <!-- row 5 -->
  <circle cx="70" cy="350" r="26" fill="#ffffff"/>
  <circle cx="140" cy="350" r="26" fill="#ffffff"/>
  <circle cx="210" cy="350" r="26" fill="#ffffff"/>
  <circle cx="280" cy="350" r="26" fill="#ffffff"/>
