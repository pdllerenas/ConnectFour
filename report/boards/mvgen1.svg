<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470">

  <!-- circle coordinates for reference:
       cx: 70,140,210,280,350,420,490
       cy: 70,140,210,280,350,420
  -->

  <!-- column labels (centered on each cx) -->
  <text x="70"  y="25" font-size="22" text-anchor="middle" font-family="sans-serif">A</text>
  <text x="140" y="25" font-size="22" text-anchor="middle" font-family="sans-serif">B</text>
  <text x="210" y="25" font-size="22" text-anchor="middle" font-family="sans-serif">C</text>
  <text x="280" y="25" font-size="22" text-anchor="middle" font-family="sans-serif">D</text>
  <text x="350" y="25" font-size="22" text-anchor="middle" font-family="sans-serif">E</text>
  <text x="420" y="25" font-size="22" text-anchor="middle" font-family="sans-serif">F</text>
  <text x="490" y="25" font-size="22" text-anchor="middle" font-family="sans-serif">G</text>

  <!-- row labels (centered on each cy) -->
  <text x="15" y="75"  font-size="22" text-anchor="middle" font-family="sans-serif">6</text>
  <text x="15" y="145" font-size="22" text-anchor="middle" font-family="sans-serif">5</text>
  <text x="15" y="215" font-size="22" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="15" y="285" font-size="22" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="15" y="355" font-size="22" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="15" y="425" font-size="22" text-anchor="middle" font-family="sans-serif">1</text>

  <!-- red board background -->
  <rect x="30" y="30" width="500" height="430" rx="12" ry="12" fill="#0074B3"/>

  <!-- holes (7×6) -->
  <!-- row 1 -->
  <circle cx="70" cy="70" r="26" fill="#ffffff"/>
  <circle cx="140" cy="70" r="26" fill="#ffffff"/>
  <circle cx="210" cy="70" r="26" fill="#ffffff"/>
  <circle cx="280" cy="70" r="26" fill="#ffffff"/>
  <circle cx="350" cy="70" r="26" fill="#ffffff"/>
  <circle cx="420" cy="70" r="26" fill="#ffffff"/>
  <circle cx="490" cy="70" r="26" fill="#ffffff"/>

  <!-- row 2 -->
  <circle cx="70" cy="140" r="26" fill="#ffffff"/>
  <circle cx="140" cy="140" r="26" fill="#ffffff"/>
  <circle cx="210" cy="140" r="26" fill="#ffffff"/>
  <circle cx="280" cy="140" r="26" fill="#ffffff"/>
  <circle cx="350" cy="140" r="26" fill="#ffffff"/>
  <circle cx="420" cy="140" r="26" fill="#ffffff"/>
  <circle cx="490" cy="140" r="26" fill="#ffffff"/>

  <!-- row 3 -->
  <circle cx="70" cy="210" r="26" fill="#ffffff"/>
